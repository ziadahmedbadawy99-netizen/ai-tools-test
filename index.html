<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براند الملابس الخاص بك</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #111;
            color: #fff;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        header p {
            font-size: 1.2em;
            color: #ccc;
        }
        .hero {
            padding: 60px 20px;
            background-color: #fff;
        }
        .btn {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-size: 1.1em;
            border-radius: 5px;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #d35400;
        }
        footer {
            background-color: #222;
            color: #aaa;
            padding: 20px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>أهلاً بكم في البراند الخاص بنا</h1>
        <p>أرقى تصاميم الملابس العصرية للرجال والشباب</p>
    </header>

    <div class="hero">
        <h2>مجموعة مميزة قادمة قريباً</h2>
        <p>انتظروا أحدث صيحات الموضة والأزياء بأعلى جودة وأفضل الأسعار.</p>
        <a href="#" class="btn">تواصل معنا عبر الفيسبوك</a>
    </div>

</body>
</html>
